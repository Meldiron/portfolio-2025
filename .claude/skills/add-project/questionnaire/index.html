<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Questionnaire</title>
<style>
  :root { --ink: #1a1a1f; --soft: #66666f; --line: #e3e3e8; --wash: #f4f4f6; --accent: #2458d6; --paper: #fff; }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 820px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1 1 auto; }
  .bar h1 span { color: var(--soft); font-weight: 400; }
  .status { font-size: 13px; color: var(--soft); min-width: 9em; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 6px; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:hover { border-color: var(--ink); }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  .lead { color: var(--soft); margin: 0 0 28px; }
  h2 { font-size: 22px; margin: 36px 0 12px; }
  .summary p { margin: 0 0 12px; }
  .corrections { background: var(--wash); padding: 16px; border-radius: 8px; margin-top: 16px; }
  .corrections label { display: block; font-weight: 600; margin-bottom: 6px; }
  .corrections small { display: block; color: var(--soft); margin-bottom: 10px; }
  .q { padding: 24px 0; border-top: 1px solid var(--line); }
  .q h3 { font-size: 18px; margin: 0 0 8px; }
  .context { margin: 0 0 12px; padding: 0 0 0 14px; border-left: 3px solid var(--line); color: var(--soft); font-size: 14px; list-style: none; }
  .context li { margin: 2px 0; }
  .hint { margin: 0 0 12px; color: var(--soft); font-size: 14px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .opts label { display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 15px; }
  .opts label:has(input:checked) { border-color: var(--ink); background: var(--wash); }
  .opts input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  textarea { width: 100%; min-height: 84px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); resize: vertical; }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .out { display: none; margin-top: 32px; }
  .out.show { display: block; }
  .out p { color: var(--soft); font-size: 14px; }
  .out textarea { min-height: 320px; font: 13px/1.45 ui-monospace, Menlo, monospace; }
  .foot { margin-top: 40px; font-size: 13px; color: var(--soft); display: flex; gap: 16px; }
  .foot a { color: var(--soft); }
  .error { background: #fde8e8; color: #8a1c1c; padding: 16px; border-radius: 8px; }
</style>
</head>
<body>
<div class="bar"><div class="bar-inner">
  <h1 id="heading">Questionnaire</h1>
  <span class="status" id="status"></span>
  <button type="button" id="download">Download .md</button>
  <button type="button" id="copy" class="primary">Copy answers</button>
</div></div>
<main id="app"><p class="lead">Loading…</p></main>
<script src="./questions.js"></script>
<script>
(() => {
  const Q = window.QUESTIONNAIRE;
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  if (!Q || !Array.isArray(Q.questions)) {
    app.innerHTML = '<p class="error">questions.js did not load or has no questions. Run open.mjs again.</p>';
    return;
  }
  const KEY = `questionnaire:${Q.slug}`;
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  document.getElementById('heading').innerHTML = `${esc(Q.title)} <span>· questionnaire</span>`;
  document.title = `${Q.title} · questionnaire`;

  let html = `<p class="lead">Write what only you know: why, what was hard, what you learned. Short notes are fine, typos too. Answers save in this browser as you type. When done, press <strong>Copy answers</strong> and paste the result into the chat, or <strong>Download .md</strong>.</p>`;
  html += `<h2>What the agent found</h2><div class="summary">${(Q.summary ?? []).map((p) => `<p>${esc(p)}</p>`).join('')}</div>`;
  html += `<div class="corrections"><label for="corrections">Anything wrong or missing above?</label><small>Only corrections. Everything else goes into the questions below.</small><textarea id="corrections">${esc(saved.corrections)}</textarea></div>`;
  let section = null;
  for (const it of Q.questions) {
    if (it.section && it.section !== section) { section = it.section; html += `<h2>${esc(section)}</h2>`; }
    const a = saved.answers?.[it.id] ?? {};
    html += `<div class="q" data-id="${esc(it.id)}"><h3>${esc(it.q)}</h3>`;
    if (it.context?.length) html += `<ul class="context">${it.context.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>`;
    if (it.hint) html += `<p class="hint">${esc(it.hint)}</p>`;
    if (it.type === 'multi') {
      const picked = new Set(a.picks ?? []);
      html += `<div class="opts">${it.options.map((o) => `<label><input type="checkbox" value="${esc(o)}" ${picked.has(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div>`;
    }
    html += `<textarea placeholder="${it.type === 'multi' ? 'Add a note, or say why…' : 'Your answer…'}">${esc(a.note)}</textarea></div>`;
  }
  html += `<div class="out" id="out"><p>Copied. If the clipboard did not take it, select everything below and copy by hand.</p><textarea id="md" readonly></textarea></div>`;
  html += `<div class="foot"><a href="#" id="clear">Clear my answers</a></div>`;
  app.innerHTML = html;

  const grow = (t) => { t.style.height = 'auto'; t.style.height = `${Math.max(84, t.scrollHeight + 2)}px`; };
  app.querySelectorAll('textarea').forEach(grow);

  function collect() {
    const answers = {};
    for (const it of Q.questions) {
      const box = app.querySelector(`.q[data-id="${CSS.escape(it.id)}"]`);
      answers[it.id] = { picks: [...box.querySelectorAll('input:checked')].map((i) => i.value), note: box.querySelector('textarea').value.trim() };
    }
    return { corrections: document.getElementById('corrections').value.trim(), answers };
  }
  function save() {
    const data = collect();
    localStorage.setItem(KEY, JSON.stringify(data));
    const done = Object.values(data.answers).filter((a) => a.note || a.picks.length).length;
    document.getElementById('status').textContent = `${done} of ${Q.questions.length} answered · saved`;
  }
  app.addEventListener('input', (e) => { if (e.target.tagName === 'TEXTAREA') grow(e.target); save(); });
  app.addEventListener('change', save);
  save();

  function markdown() {
    const d = collect();
    const today = new Date();
    const date = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    const lines = [
      '---', `project: "${Q.slug}"`, `title: "${Q.title}"`, `answeredAt: ${date}`, '---', '',
      'These are the questions an agent asked me before writing this case study, and my answers exactly as I typed them, typos included. I answered them in a form, and the agent turned them into the article.', '',
      '## What the agent found', '',
      'Before asking anything, the agent read the code, the commit history and the live app. This is the summary it showed me.', '',
      ...(Q.summary ?? []).flatMap((p) => [p, '']),
      '### My corrections', '', d.corrections || 'None.', '',
    ];
    let section = null;
    for (const it of Q.questions) {
      if (it.section && it.section !== section) { section = it.section; lines.push(`## ${section}`, ''); }
      else if (!it.section && section === null) { section = 'Questions'; lines.push('## Questions', ''); }
      lines.push(`### ${it.q}`, '');
      if (it.context?.length) lines.push(`_The agent noted: ${it.context.join(' ')}_`, '');
      if (it.hint) lines.push(`_${it.hint}_`, '');
      const a = d.answers[it.id];
      if (it.type === 'multi') lines.push(a.picks.length ? a.picks.map((p) => `**${p}**`).join(', ') : '**Nothing picked**', '');
      lines.push(a.note || '(no answer)', '');
    }
    return lines.join('\n').replace(/\n{3,}/g, '\n\n');
  }
  async function showAndCopy() {
    const md = markdown();
    const ta = document.getElementById('md'); ta.value = md; document.getElementById('out').classList.add('show');
    try { await navigator.clipboard.writeText(md); document.getElementById('status').textContent = 'Copied to clipboard'; }
    catch { ta.focus(); ta.select(); document.execCommand('copy'); document.getElementById('status').textContent = 'Copied (select below if not)'; }
    ta.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('copy').addEventListener('click', showAndCopy);
  document.getElementById('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([markdown()], { type: 'text/markdown' }));
    a.download = `${Q.slug}.md`; a.click();
  });
  document.getElementById('clear').addEventListener('click', (e) => {
    e.preventDefault();
    if (!confirm('Clear every answer in this form?')) return;
    localStorage.removeItem(KEY); location.reload();
  });
})();
</script>
</body>
</html>
